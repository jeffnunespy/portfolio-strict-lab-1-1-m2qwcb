name: Pinning pin14-composite-tag
on:
  push:
    branches: [pin14-composite-tag]

permissions:
  contents: read

jobs:
  pinning-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pin14
