name: Neutral Fixture
on:
  pull_request:
    branches: [neutral-target]

permissions: {}

jobs:
  emit-fixture:
    if: >-
      github.repository == 'jeffnunespy/portfolio-strict-lab-1-1-m2qwcb' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'm3-neutral'
    runs-on: ubuntu-24.04
    permissions:
      checks: write
    steps:
      - name: Publish the neutral fixture result
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_HEAD: $\{\{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=lab-neutral -f head_sha="$FIXTURE_HEAD" \
            -f status=completed -f conclusion=neutral \
            -f 'output[title]=Synthetic neutral result' \
            -f 'output[summary]=Disposable lab check for merge-rule semantics' \
            --jq '{id,name,head_sha,app_id:.app.id,status,conclusion}'
